id = "enderwolf50.sidebar-idx"
name = "Sidebar Index"
version = "0.3.0"
min_herdr_version = "0.9.3"
description = "Show workspace and agent numbers in the sidebar via the $idx token"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["go", "build", "-o", "sidebar-idx", "."]
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "sidebar-idx.exe", "."]
platforms = ["windows"]

[[startup]]
command = ["./sidebar-idx"]

[[events]]
on = "workspace.created"
command = ["./sidebar-idx", "-delay", "500ms"]

[[events]]
on = "workspace.closed"
command = ["./sidebar-idx", "-delay", "500ms"]

[[events]]
on = "workspace.moved"
command = ["./sidebar-idx", "-delay", "500ms"]

[[events]]
on = "workspace.reordered"
command = ["./sidebar-idx", "-delay", "500ms"]

[[events]]
on = "tab.created"
command = ["./sidebar-idx", "-delay", "500ms"]

[[events]]
on = "tab.closed"
command = ["./sidebar-idx", "-delay", "500ms"]

[[events]]
on = "pane.created"
command = ["./sidebar-idx", "-delay", "500ms"]

[[events]]
on = "pane.closed"
command = ["./sidebar-idx", "-delay", "500ms"]

[[events]]
on = "pane.moved"
command = ["./sidebar-idx", "-delay", "500ms"]

[[events]]
on = "pane.agent_detected"
command = ["./sidebar-idx", "-delay", "500ms"]

[[actions]]
id = "sync"
title = "Sync sidebar numbers"
contexts = ["workspace"]
command = ["./sidebar-idx"]
